name: smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 环境信息
        run: node -v && npm -v && git --version
      - name: 语法检查
        run: node --check bus/cli.mjs
      # 用人类可读模式跑：失败时日志直接显示哪个套件红、哪条断言失败。
      # --json 会把所有输出压成一坨，CI 日志里反而看不出原因。
      - name: 全量测试（CI profile：必需套件被跳过即失败）
        run: node bus/smoke-all.mjs --profile ci
      - name: 发布包检查
        run: node bus/cli.mjs release-check --skip-smoke
